<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // Runs before the stylesheet paints: no flash of the wrong theme.
    (function () {
      var t = localStorage.getItem('sm_theme');
      if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Management Portal – Siri Mane Ladies PG, Tumakuru</title>

  <meta name="description" content="Siri Mane PG management dashboard. Admin access only."/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="theme-color" content="#4F46E5"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Siri Mane Admin"/>
  <link rel="icon" type="image/png" href="/favicon.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
<div id="icon-sprite" hidden></div>

<!-- LOGIN PAGE -->
<div id="login-page" class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <img src="/images/logo.png" alt="Siri Mane – Ladies Paying Guest" style="width:200px;height:auto;border-radius:10px;"/>
    </div>
    <h2 style="font-size:18px;font-weight:700;margin-bottom:4px;text-align:center">Management Login</h2>
    <p style="font-size:13px;color:#64748B;text-align:center;margin-bottom:22px">Enter your password to access the dashboard</p>
    <div id="login-alert" class="alert alert-danger hidden"></div>
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="login-username" placeholder="admin" autocomplete="username"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;padding:11px" id="login-btn">🔐 Login</button>
    <p style="text-align:center;margin-top:16px;font-size:14px;color:#94A3B8;font-family:'Cormorant Garamond',serif;letter-spacing:0.04em;"><em style="color:#C9A96E;font-style:italic;">Siri</em> Mane PG Management</p>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img src="/images/logo.png" alt="Siri Mane – Ladies Paying Guest" style="width:100%;max-width:180px;height:auto;border-radius:8px;display:block;margin:0 auto;"/>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-page="dashboard"><svg class="ic"><use href="#i-home"/></svg> Home</button>
      <button class="nav-item" data-page="guests"><svg class="ic"><use href="#i-users"/></svg> Residents</button>
      <button class="nav-item" data-page="rooms"><svg class="ic"><use href="#i-bed"/></svg> Rooms</button>
      <button class="nav-item" data-page="operations"><svg class="ic"><use href="#i-check-square"/></svg> Operations <span id="complaints-badge" class="nav-badge hidden"></span></button>
      <button class="nav-item" data-page="finance"><svg class="ic"><use href="#i-wallet"/></svg> Finance</button>
      <button class="nav-item" data-page="inbox"><svg class="ic"><use href="#i-inbox"/></svg> Messages <span id="inbox-badge" class="nav-badge hidden"></span></button>
      <div class="nav-section admin-only hidden" id="nav-section-admin">ADMIN</div>
      <button class="nav-item admin-only hidden" data-page="admin"><svg class="ic"><use href="#i-lock"/></svg> Admin</button>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-btn" id="logout-btn">🚪 Logout</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="flex items-center gap-2">
        <button id="menu-toggle" aria-label="Menu" style="background:none;border:none;cursor:pointer;padding:6px 8px;border-radius:6px;line-height:0"><svg class="ic ic-lg"><use href="#i-menu"/></svg></button>
        <div>
          <span id="page-title" style="font-weight:600;font-size:15px"></span>
        </div>
      </div>
      <div class="flex items-center gap-2" id="topbar-right">
        <span id="topbar-user" style="font-size:13px;color:#64748B"></span>
        <span id="today-chip" class="text-muted"></span>
        <button id="theme-toggle" aria-label="Switch theme" title="Light / dark"><svg class="ic ic-lg"><use href="#i-moon"/></svg></button>
        <button id="topbar-search" aria-label="Search" title="Search (Ctrl+K)" style="background:none;border:none;cursor:pointer;padding:8px;border-radius:8px;line-height:0"><svg class="ic ic-lg"><use href="#i-search"/></svg></button>
        <button id="topbar-add" aria-label="Quick add" title="Quick add" class="btn btn-primary btn-sm" style="padding:9px 11px;line-height:0"><svg class="ic"><use href="#i-plus"/></svg></button>
        <div id="topbar-actions"></div>
      </div>
    </header>
    <div class="content" id="page-content">
      <div class="loading-center"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<div id="modal-container"></div>
<script src="/js/api.js"></script>
<script src="/js/speech-parser.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
